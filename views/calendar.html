<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../resources/css/styles_calendar.css">
  </head>
  <body>
    <div class="row">
        <div class="col-2">
            <div class="custom-container">
                <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#event_modal">Create Event</button>
            </div>
        </div>
        <!-- Modal -->
        <div class="modal fade" id="event_modal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="eventModalLabel">Create/Update Event</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="event_form" class="vstack gap-2 w-75 needs-validation" novalidate>
                            <div>
                                <input name="name" type="text" id="event_name" class="form-control" placeholder="Event name" required>
                                <div class="invalid-feedback">Please enter the event name.</div>
                            </div>
                            <select name="weekday" class="form-select" id="event_weekday" required>
                                <option value="sunday">Sunday</option>
                                <option value="monday">Monday</option>
                                <option value="tuesday">Tuesday</option>
                                <option value="wednesday">Wednesday</option>
                                <option value="thursday">Thursday</option>
                                <option value="friday">Friday</option>
                                <option value="saturday">Saturday</option>
                            </select>
                            <div>
                                <input name="time" type="time" id="event_time" class="form-control" required>
                                <div class="invalid-feedback">Please enter the event time.</div>
                            </div>
                            <select name="modality" class="form-select" id="event_modality" onchange="updateLocationOptions(this.value)">
                                <option value="In Person">In Person</option>
                                <option value="Remote">Remote</option>
                            </select>
                            <div id="event_location_container">
                                <input name="location" type="text" id="event_location" class="form-control" placeholder="Location" required>
                                <div class="invalid-feedback">Please enter the event location.</div>
                            </div>
                            <div id="event_remote_url_container" class="d-none">
                                <input name="remote_url" type="url" id="event_remote_url" class="form-control" placeholder="Remote URL">
                                <div class="invalid-feedback">Please enter a valid event URL.</div>
                            </div>
                            <div>
                                <input name="attendees" type="text" id="event_attendees" class="form-control" placeholder="Attendees, comma seperated" required>
                                <div class="invalid-feedback">Please enter the event attendees.</div>
                            </div>
                            <select name="category" class="form-select" id="event_category">
                                <option value="Academic">Academic</option>
                                <option value="Work">Work</option>
                                <option value="Personal">Personal</option>
                                <option value="Social">Social</option>
                            </select>
                            <button type="submit" class="btn btn-primary" id="save_button">Save event</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- End modal -->
        <div class="col">
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">
                            Sunday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">
                            Monday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Tuesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Wednesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">
                            Thursday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">
                            Friday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">
                            Saturday
                        </div>
                    </div>
                </div>        
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../resources/js/script.js"></script>
  </body>
</html>

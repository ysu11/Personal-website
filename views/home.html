<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../resources/css/styles.css">
  </head>
  <!-- Bootstrap class explanation 1: flex-column
    Element using it: body
    flex-column sets the container to a vertical orientation, stacking the child items on-top of eachother.
    Here it is used to organize the page from top to bottom: header, main, then footer.
  -->
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="home.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="hobbies.html">Hobbies</a></li>
              <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
              <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Bootstrap class explanation 2: flex-grow-1
      Element using it: main
      flex-grow-1 tells the container to fill all of the remaining space.
      If main didn't use flex-grow-1, then the footer would be right below the main content instead of at the bottom of the page.
    -->
    <main class="flex-grow-1">
      <div class="container text-center py-5">
        <img src="../resources/img/tux.png" alt="Linux mascot (Tux)" class="img-fluid homeimg mb-4">
        <h1 class="display-4">Lincoln Gubser</h1>
        <p class="lead col-lg-6 mx-auto">I am a second-year Computer Science student at the University of Colorado Boulder.</p>
        <a href="calendar.html" class="btn btn-primary btn-lg mt-3">Calendar</a>
      </div>
    </main>

    <!-- Bootstrap class explanation 3: px-2
      Element using it: footer
      p{x/y}-a pads an element in the x or y directions a * 0.5 rem amount.
      So px-2 pads the github logo 2rem on the left and right sides of it.
      py-2 pads it 2rem on the top and bottom of it.
    -->
    <footer class="px-2 py-2">
      <a target="_blank" href="https://github.com/ysu11">
        <img src="../resources/img/github_logo.png" alt="Github Logo" class="footerimg">
      </a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
